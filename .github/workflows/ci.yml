name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported. The middle versions add little and the
        # matrix is not where CI minutes should go.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Run the pipeline end to end
        run: python -m src.run_analysis --no-figures

      # The committed sample must be exactly what the generator produces.
      # Otherwise the numbers in the README describe a file nobody can rebuild.
      - name: Sample data is reproducible
        run: |
          python src/generate_sample.py
          git diff --exit-code -- data/sample \
            || (echo "::error::data/sample differs from generate_sample.py output" && exit 1)

      # Same contract for the dashboard: the committed JSON has to match the
      # analysis it claims to show, or the site and the report disagree.
      - name: Dashboard data is in sync with the analysis
        run: |
          python -m src.export_web
          git diff --exit-code -- web/data \
            || (echo "::error::web/data is stale - run python -m src.export_web" && exit 1)

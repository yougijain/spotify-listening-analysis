# Deploy the dashboard to GitHub Pages.
#
# The primary host is Vercel (see vercel.json), which deploys straight from the
# repo with no workflow at all. This exists so the site is not tied to one
# vendor: the whole thing is four static files, and that should stay true.
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site if the repo does not already have one.
          # Without this the action fails with "Get Pages site failed ...
          # Not Found" on any repo where Pages was never switched on, which
          # is every repo by default - so this workflow went red the moment
          # it first ran. The pages: write permission above is what lets it.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
